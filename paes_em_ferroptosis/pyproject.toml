[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paes-em-ferroptosis"
version = "0.1.0"
description = "PAEs -> ferroptosis -> EMT -> endometriosis multi-omics pipeline (network toxicology + bulk/sc/spatial transcriptomics + virtual KO + docking)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
full = ["xgboost>=2.0", "scanpy>=1.9", "anndata>=0.10", "GEOparse>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
paes-em = "paes_em.cli:main"

[tool.setuptools.packages.find]
include = ["paes_em*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
