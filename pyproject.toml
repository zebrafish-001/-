[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zfbehavior"
version = "0.1.0"
description = "Zebrafish (larval / adult) locomotor behaviour video tracking and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.11",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "opencv-python-headless>=4.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
dev = ["pytest>=7"]

[project.scripts]
zfb = "zfbehavior.cli:main"

[tool.setuptools.packages.find]
include = ["zfbehavior*"]

[tool.setuptools.package-data]
zfbehavior = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
