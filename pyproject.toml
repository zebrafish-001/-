[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zfbehavior"
version = "0.1.0"
description = "Zebrafish (larval / adult) locomotor behaviour video tracking and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.11",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "opencv-python-headless>=4.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    # tocmaker
    "lxml>=4.9",
    "python-pptx>=0.6.21",
    "cairosvg>=2.5",
    "pillow>=9.0",
    "requests>=2.28",
    "vtracer>=0.6",
    "svgelements>=1.9",
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3", "opencv-python-headless>=4.6"]

parquet = ["pyarrow>=10"]
dev = ["pytest>=7"]

[project.scripts]
zfb = "zfbehavior.cli:main"
toc = "tocmaker.cli:main"

[tool.setuptools.packages.find]
include = ["zfbehavior*", "tocmaker*"]

[tool.setuptools.package-data]
zfbehavior = ["presets/*.yaml"]
tocmaker = ["assets/icons/**/*.svg", "assets/icons/**/*.json", "assets/icons/**/*.md", "db/*.yaml", "db/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
