# journal_specs.yaml - graphical abstract / TOC graphic specs. Generated by tocmaker research; see meta.method.
meta:
  title: Graphical abstract / TOC graphic specifications for environmental toxicology and population health journals
  compiled: '2026-10-13'
  method: WebSearch result snippets of publisher pages (direct fetch of publisher sites is blocked in the research container). 'primary' = publisher's own page/PDF; 'secondary' = third-party or inferred
    from absence on official pages; 'unconfirmed' = could not be verified, best secondary value given.
  field_notes:
    ga_required: true / false (journal does not use a GA or TOC graphic) / optional / unknown
    width_mm_height_mm: box size; where a publisher states only pixels, mm derived at 300 dpi (and vice-versa); derived values are flagged in notes
    aspect_ratio: width:height
    issn: print or first-listed ISSN from general knowledge, not independently re-verified in this search
journals:
- journal: Environmental Science & Technology (ES&T)
  issn: 0013-936X
  ga_required: true
  publisher: ACS (American Chemical Society)
  width_mm: 82.55
  height_mm: 44.45
  width_px: 975
  height_px: 525
  min_dpi: 300
  aspect_ratio: 13:7 (1.857)
  max_text_pt: 8
  min_text_pt: 6
  fonts:
  - Helvetica (sans serif recommended)
  file_formats:
  - TIF 300 dpi colour
  - TIF 1200 dpi B&W
  - EPS (RGB) accepted by some ACS journals per third-party guides
  content_rules:
  - Submit at actual TOC size; must fit within 3.25 in x 1.75 in (approx. 8.25 cm x 4.45 cm)
  - Sans-serif font such as Helvetica, preferably 8 pt, no smaller than 6 pt
  - Save as TIF at 300 dpi (colour) or 1200 dpi (black-and-white line art)
  - Entirely original, unpublished artwork created by one of the coauthors
  - No photograph, drawing or caricature of any person, living or deceased
  - No postage stamps, currency of any country, or trademarked items (company logos, images, products)
  - 'Purpose: with the title, give a quick visual impression of the essence of the manuscript WITHOUT providing specific results'
  - Text usually limited to labeling of compounds, reaction arrows and diagrams
  - Label 'For Table of Contents Only' and place on the last page of the manuscript (general ACS guideline; some journals place it after the title page)
  - 'ES&T-specific: TOC art acts as a ''visual abstract'' that illustrates the manuscript without being an exact duplicate of contained figures'
  - 'ES&T-specific: required for Research Articles, Policy Analysis, Reviews, Perspectives, Features; NOT required for Viewpoints, Spotlights, Correspondence/Rebuttals'
  - TOC art is not counted in word limits
  notes: ACS publisher-wide TOC/Abstract-graphic guideline (updated 2024-02-28) confirmed from ACS's own PDF. ES&T author guidelines (researcher-resources.acs.org, coden=esthag) list which article types
    need it; they point to the same ACS TOC spec document. Pixel size 975x525 is derived (3.25x1.75 in at 300 dpi), not stated by ACS.
  sources:
  - https://pubsapp.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf
  - https://researcher-resources.acs.org/publish/author_guidelines?coden=esthag
  - https://pubs.acs.org/page/esthag/submission/revisions.html
  - https://www2.cortland.edu/offices/ict/files-to-share/2017 Guidelines for Table of Contents, Abstract Graphics.pdf
  confidence: primary
