  - MS Office
  content_rules:
  - Minimum 1328 x 531 px (w x h) at 300 dpi; larger images keep the 500:200 ratio (displayed in a 500 x 200 px window on ScienceDirect)
  - 'Fonts: Times, Arial, Courier or Symbol; large enough to remain legible when reduced to 200 px height'
  - 'Preferred file types: TIFF, EPS, PDF or MS Office files; submit as a separate file'
  - No additional text, outline or synopsis; any text or label must be part of the image file
  - No unnecessary white space; no 'graphical abstract' heading inside the image
  - Clear start and end, preferably 'reading' from top to bottom or left to right
  - Must be an original image that clearly represents the work; obtain permission for any third-party material
  - Use of generative AI in artwork must comply with Elsevier's GenAI policy (several journals prohibit it outright)
  - 'Journal: graphical abstract REQUIRED at submission'
  - 'Journal: Highlights REQUIRED (3-5 bullets, max 85 characters each incl. spaces, separate editable file named with ''highlights'')'
  notes: Guide for Authors on ScienceDirect states both GA and Highlights are required at submission. mm values are the 1328x531 px minimum expressed at 300 dpi.
