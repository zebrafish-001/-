design_guidance:
- publisher: ACS
  source: https://pubsapp.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf
  confidence: primary
  points:
  - '"This graphic should capture the reader''s attention and, in conjunction with the manuscript title, should give the reader a quick visual impression of the essence of the manuscript without providing
    specific results."'
  - '"Text should usually be limited to the labeling of compounds, reaction arrows, and diagrams."'
  - '"The graphic must be entirely original, unpublished artwork created by one of the coauthors." No person (photo/drawing/caricature), no stamps, currency or trademarked items.'
  - 'ES&T: TOC art is a ''visual abstract'' that should ''simply illustrate your manuscript without being an exact duplicate of contained figures''.'
  - 'Chem. Res. Toxicol.: tables and spectra not acceptable; complex structure schemes and small details discouraged; no legend.'
  - 'ACS Pharmacology & Translational Science (same rule family): tables or spectra are not acceptable as TOC/abstract artwork.'
- publisher: Elsevier
  source: https://www.elsevier.com/researcher/author/tools-and-resources/graphical-abstract
  confidence: primary
  points:
  - '"A graphical abstract is a single, concise, pictorial and visual summary of the main findings of the article." (i.e. Elsevier wants the key finding shown - opposite of ACS''s ''no specific results'').'
  - '"The graphical abstract should have a clear start and end, preferably ''reading'' from top to bottom or left to right."'
  - '"No additional text, outline or synopsis should be included. Any text or label must be part of the image file. Please do not use unnecessary white space or a heading ''graphical abstract'' within the
    image file."'
  - 'MCP journal guideline: "highlight one process or make one point clear"; simple labels, minimal text; layouts may be linear (up/down, left/right) or centric with arrows pointing outwards.'
  - 'Elsevier Connect: do not simply reuse a figure from the article; ''less is more'' with ample white space; start with the research question, middle = how addressed, end = conclusion (''so what'').'
  - Fonts Times/Arial/Courier/Symbol; minimum 1328 x 531 px at 300 dpi; permission needed for any third-party material; GenAI policy applies.
- publisher: Cell Press
  source: https://www.cell.com/pb/assets/raw/shared/figureguidelines/GA_guide.pdf
  confidence: primary
  points:
  - '"The graphical abstract is one single-panel image designed to give readers an immediate understanding of the take-home message of the paper."'
  - '"Not include data items of any type; all content should be in a graphical form."'
  - '"The graphical abstract should be distinct from any model figures or diagrams in the paper itself."'
  - Clear start and end; read top-to-bottom or left-to-right; emphasise the new findings without excess detail from prior literature.
  - Colour should direct attention; avoid heavily saturated primaries; "when in doubt, try to avoid red/green and red/black as comparative color choices."
  - 1200 px square at 300 dpi; Arial/Avenir 12-16 pt (journal pages); TIFF/PDF/JPEG; the file must contain only the image; general-purpose generative-AI tools not allowed.
- publisher: Wiley
  source: https://onlinelibrary.wiley.com/pb-assets/25673165/Graphic%20TOC-1577161100207.pdf
  confidence: primary
  points:
  - 'Wiley ''Guidelines for Graphic in Table of Contents'': "simple but informative"; use colour if helpful; avoid long text; graphic may be a structure, graph, drawing, photograph or scheme with text usually
    limited to labeling compounds, reaction arrows and diagrams.'
  - 'Wiley GA guideline PDF: the GA must stand on its own, keep text to a minimum, use a white background, sans-serif 12-16 pt, high-resolution standard format; present the article''s main findings and
    be self-explanatory.'
  - 'Wiley TOC-entry workflow: TOC entry = image + short abstract text (nominal upper limit 100 words); online the image is sized to 180 px wide, so detail must survive heavy reduction.'
  - 'Advanced portfolio (Advanced Science etc.): ToC text 50-60 words, third person, general audience; image 55 x 50 mm or 110 x 20 mm; labels >= 10 pt; author must own copyright of all elements.'
  - 'Some Wiley journals: no AI-platform-generated artwork; images of people must avoid stereotyping; avoid religious/political imagery.'
